<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup — Custom plans: the 3 open questions (option A vs B)</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { margin: 0; background: #F0F1FA; font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; color: #1A1D2E; display: flex; flex-direction: column; }
  header { padding: 14px 22px 0; }
  h1 { font-size: 16px; margin: 0; }
  .hint { font-size: 11.5px; color: #5A6080; margin: 3px 0 10px; }
  .qtabs { display: inline-flex; gap: 4px; background: #fff; border: 1px solid #E4E6F3; border-radius: 22px; padding: 4px; }
  .qtab { border: none; background: none; font-family: inherit; font-size: 12.5px; font-weight: 700; color: #5A6080; padding: 7px 16px; border-radius: 18px; cursor: pointer; }
  .qtab.act { background: #4040C8; color: #fff; }
  .q { font-size: 13px; font-weight: 700; margin: 12px 0 0; }
  .q span { font-weight: 500; color: #5A6080; }
  main { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 12px 22px 18px; }
  .opt { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #fff; border: 2px solid #ECEEF8; border-radius: 16px; overflow: hidden; }
  .opt.rec { border-color: #4040C8; }
  .opt-h { padding: 10px 14px; border-bottom: 1px solid #F2F3FA; display: flex; align-items: center; gap: 8px; }
  .opt-h b { font-size: 13px; }
  .opt-h .why { font-size: 11px; color: #5A6080; }
  .rec-pill { font-size: 10px; font-weight: 800; background: #4040C8; color: #fff; border-radius: 10px; padding: 2px 8px; margin-left: auto; white-space: nowrap; }
  .screen { flex: 1; min-height: 0; background: #F4F5FB; padding: 12px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; }
  .side { width: 92px; background: #3535B8; border-radius: 10px; padding: 8px 6px; color: #fff; font-size: 9.5px; flex: none; }
  .side div { padding: 5px 7px; border-radius: 6px; opacity: .8; }
  .side .act { background: rgba(255,255,255,.18); opacity: 1; font-weight: 700; }
  .side .n { float: right; background: #fff; color: #3535B8; border-radius: 8px; padding: 0 5px; font-weight: 800; }
  .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .tabs { display: inline-flex; gap: 3px; background: #fff; border: 1px solid #E4E6F3; border-radius: 16px; padding: 3px; align-self: flex-start; }
  .tab { font-size: 10.5px; font-weight: 600; color: #5A6080; padding: 4px 10px; border-radius: 12px; }
  .tab.act { background: #4040C8; color: #fff; }
  .tab i { font-style: normal; font-size: 9px; background: #EEEEFF; color: #4040C8; border-radius: 8px; padding: 0 5px; margin-left: 3px; }
  .tab.act i { background: rgba(255,255,255,.25); color: #fff; }
  .row { flex: 1; min-height: 0; display: flex; gap: 8px; }
  .co { width: 130px; background: #fff; border-radius: 10px; border: 1px solid #ECEEF8; font-size: 10px; padding: 6px 0; flex: none; }
  .co div { padding: 5px 9px; display: flex; justify-content: space-between; }
  .co .sel { background: #EEEEFF; font-weight: 700; box-shadow: inset 3px 0 0 #4040C8; }
  .co .t { font-size: 9px; text-transform: uppercase; color: #9BA3C4; letter-spacing: .06em; }
  .stage { flex: 1; min-width: 0; border-radius: 10px; background: linear-gradient(#3838BA 0 46%, #fff 46%); border: 1px solid #ECEEF8; padding: 10px; display: flex; flex-direction: column; }
  .stage-t { color: #fff; text-align: center; font-size: 11px; font-weight: 800; margin-bottom: 10px; }
  .cards { display: flex; gap: 8px; justify-content: center; }
  .card { width: 92px; background: #fff; border-radius: 12px; box-shadow: 0 4px 14px rgba(26,29,46,.1); padding: 16px 7px 8px; position: relative; font-size: 9px; }
  .card .tag { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 700; font-size: 8.5px; padding: 3px 7px; border-radius: 6px; white-space: nowrap; }
  .card .pr { text-align: center; font-weight: 800; font-size: 15px; margin: 2px 0 4px; }
  .card .l { color: #5A6080; padding: 1px 0; }
  .card .l.off { color: #C9CBDA; }
  .st { display: block; text-align: center; font-size: 8px; font-weight: 800; border-radius: 6px; padding: 1px 0; margin-bottom: 3px; }
  .st.d { background: #F2F3FA; color: #9BA3C4; } .st.p { background: rgba(34,197,94,.12); color: #16A34A; }
  .pager { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #9BA3C4; padding-top: 8px; }
  .pager span.b { display: inline-block; min-width: 16px; text-align: center; border: 1px solid #E4E6F3; border-radius: 5px; margin-left: 2px; padding: 1px 3px; color: #5A6080; background: #fff; }
  .pager span.b.act { background: #4040C8; color: #fff; border-color: #4040C8; }
  table { width: 100%; border-collapse: collapse; font-size: 10px; background: #fff; border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 8.5px; text-transform: uppercase; color: #9BA3C4; padding: 6px 8px; border-bottom: 1px solid #F2F3FA; }
  td { padding: 7px 8px; border-bottom: 1px solid #F5F6FB; }
  .btn { display: inline-block; font-size: 9px; font-weight: 700; background: #4040C8; color: #fff; border-radius: 6px; padding: 3px 7px; }
  .badge { font-size: 8.5px; font-weight: 700; border-radius: 8px; padding: 1px 6px; background: #FFF4E0; color: #B26B00; }
  .strip { display: flex; gap: 8px; overflow: hidden; position: relative; padding-top: 10px; }
  .arrow { position: absolute; right: 2px; top: 40%; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); display: grid; place-items: center; font-size: 10px; color: #4040C8; }
  .say { font-size: 10.5px; color: #5A6080; background: #fff; border-radius: 8px; padding: 6px 9px; border: 1px dashed #C9CBF5; }
  .say b { color: #1A1D2E; }
  .client-top { font-size: 10px; color: #9BA3C4; }
</style>
</head>
<body>
<header>
  <h1>Custom plans — 3 open questions</h1>
  <div class="hint">Each question shows option <b>A</b> (my suggestion, blue border) and option <b>B</b> side by side. Answer like "1A, 2A, 3A".</div>
  <div class="qtabs" id="qtabs"></div>
  <div class="q" id="qtext"></div>
</header>
<main id="main"></main>

<script>
  const SIDE = (quotes = true) => `<div class="side"><div>Overview</div><div>Companies</div><div class="act">Subscriptions</div>${quotes ? '<div>Quotes <span class="n">1</span></div>' : ''}<div>Licenses</div></div>`;
  const card = (name, price, color, status, lines = ['Quarterly · 1', 'Annual', 'Board'], on = [0]) =>
    `<div class="card"><span class="tag" style="background:${color}">${name}</span>${status ? `<span class="st ${status === 'Draft' ? 'd' : 'p'}">${status}</span>` : ''}
     <div class="pr">${price}</div>${lines.map((l, i) => `<div class="l ${on.includes(i) ? '' : 'off'}">${on.includes(i) ? '✓' : '✗'} ${l}</div>`).join('')}</div>`;
  const pager = (label, n) => `<div class="pager"><span>${label}</span><span><span class="b">‹</span><span class="b act">1</span>${n > 1 ? '<span class="b">2</span>' : ''}<span class="b">›</span></span></div>`;
  const companies = (sel = 'Aramco') => `<div class="co"><div class="t">Company · plans</div>${[['Al Rajhi', 1], ['Aramco', 3], ['BUPA', 1], ['SABIC', 1], ['STC', 1]].map(([c, n]) => `<div class="${c === sel ? 'sel' : ''}"><span>${c}</span><span>${n}</span></div>`).join('')}${pager('5 of 12', 2)}</div>`;

  const Q = [
    {
      title: 'Q1', text: 'Where does a custom plan go while it is still a draft? <span>(e.g. "Custom plan for Aramco" right after Aramco sends an Enterprise request — no price yet, Aramco can\'t see it)</span>',
      a: { name: 'A — Custom plans tab, under Aramco', why: 'Everything for one company in one place; each card says Draft or Published.', screen: () =>
        `<div class="bar">${SIDE()}<div class="body"><div class="tabs"><span class="tab">Published<i>4</i></span><span class="tab">Drafts<i>1</i></span><span class="tab act">Custom plans<i>8</i></span></div>
         <div class="row">${companies()}<div class="stage"><div class="stage-t">Custom plans for Aramco</div><div class="cards">
         ${card('Custom plan for Aramco', '—', '#4F7BEA', 'Draft', undefined, [])}${card('Aramco — Board', '$2,400', '#14B8A6', 'Published', undefined, [2])}${card('Aramco 2027', '$5,200', '#4040C8', 'Published', undefined, [0, 1])}
         </div>${pager('3 plans', 1)}</div></div>
         <div class="say"><b>Drafts tab</b> = only drafts of plans for <b>every</b> company (e.g. "Silver"). Aramco's draft is here, with its other plans.</div></div></div>` },
      b: { name: 'B — Drafts tab until published', why: 'Drafts in one list; Custom plans shows only what the company can already buy.', screen: () =>
        `<div class="bar">${SIDE()}<div class="body"><div class="tabs"><span class="tab">Published<i>4</i></span><span class="tab act">Drafts<i>2</i></span><span class="tab">Custom plans<i>7</i></span></div>
         <div class="row"><div class="stage"><div class="stage-t">Drafts</div><div class="cards">
         ${card('Silver', '$500', '#8B5CF6', 'Draft')}${card('Custom plan for Aramco', '—', '#4F7BEA', 'Draft', undefined, [])}
         </div>${pager('2 plans', 1)}</div></div>
         <div class="say">Aramco's draft is <b>mixed in</b> with public drafts. After Publish it <b>moves</b> to Custom plans → Aramco.</div></div></div>` },
    },
    {
      title: 'Q2', text: 'Keep the Quotes page? <span>(today: Spark → Quotes lists each Enterprise request with "Make a plan")</span>',
      a: { name: 'A — Keep Quotes as the inbox', why: 'Quotes = new requests to answer (with a count). Custom plans = the plans.', screen: () =>
        `<div class="bar">${SIDE(true)}<div class="body"><div class="tabs"><span class="tab act">Needs a plan<i>1</i></span><span class="tab">Done</span></div>
         <table><thead><tr><th>Company</th><th>Name</th><th>Phone</th><th>Message</th><th></th></tr></thead>
         <tbody><tr><td>Aramco</td><td>Aizaz</td><td>+966 50 111 2222</td><td>Two subsidiaries…</td><td><span class="btn">Make a plan</span></td></tr>
         <tr><td>BUPA</td><td>Sara</td><td>+966 55 000 1234</td><td>Need ESG for 3 sites</td><td><span class="btn">Make a plan</span></td></tr></tbody></table>
         <div class="say"><b>Make a plan</b> → editor → Publish → the plan shows in <b>Subscriptions → Custom plans → Aramco</b>. The sidebar count tells Spark a new request came in.</div></div></div>` },
      b: { name: 'B — Remove Quotes', why: 'One page less; requests show as Draft cards in Custom plans.', screen: () =>
        `<div class="bar">${SIDE(false)}<div class="body"><div class="tabs"><span class="tab">Published<i>4</i></span><span class="tab">Drafts<i>1</i></span><span class="tab act">Custom plans<i>8</i></span></div>
         <div class="row">${companies()}<div class="stage"><div class="stage-t">Custom plans for Aramco</div><div class="cards">
         ${card('Custom plan for Aramco', '—', '#4F7BEA', 'Draft', ['“Two subsidiaries…”', 'Aizaz', '+966 50 111…'], [0, 1, 2])}${card('Aramco — Board', '$2,400', '#14B8A6', 'Published', undefined, [2])}
         </div>${pager('2 plans', 1)}</div></div>
         <div class="say">The request's name / phone / message show <b>on the draft card</b>. No sidebar count — a new request is easier to miss.</div></div></div>` },
    },
    {
      title: 'Q3', text: 'Client\'s own Subscription page: 3 cards per page too? <span>(what Aramco\'s admin sees)</span>',
      a: { name: 'A — Client page stays as it is', why: 'One row of cards, slides sideways with › — clients compare all plans at once.', screen: () =>
        `<div class="body"><div class="client-top">Admin Console → Subscription · You're on QA Fit Plus (1 year) until 4 Nov 2027</div>
         <div class="stage"><div class="stage-t">Choose the plan that fits your company</div><div class="strip">
         ${card('Starter', '$66', '#4F7BEA', '')}${card('Standard', '$150', '#14B8A6', '')}${card('QA Fit Plus', '$950', '#4040C8', 'Published')}${card('Made for you', '$1', '#F59E0B', '')}${card('Enterprise', "Let's talk", '#1A1D2E', '', ['Contact us'], [0])}
         <span class="arrow">›</span></div></div>
         <div class="say">Only <b>Spark's</b> page gets 3-per-page. The client's page is unchanged.</div></div>` },
      b: { name: 'B — Client page also 3 per page', why: 'Same look on both pages; clients page through plans.', screen: () =>
        `<div class="body"><div class="client-top">Admin Console → Subscription · You're on QA Fit Plus (1 year) until 4 Nov 2027</div>
         <div class="stage"><div class="stage-t">Choose the plan that fits your company</div><div class="cards">
         ${card('Starter', '$66', '#4F7BEA', '')}${card('Standard', '$150', '#14B8A6', '')}${card('QA Fit Plus', '$950', '#4040C8', 'Published')}
         </div>${pager('5 plans · page 1 of 2', 2)}</div>
         <div class="say">"Made for you" and Enterprise are on <b>page 2</b> — the client has to click to see them.</div></div>` },
    },
  ];

  let current = 0;
  function draw() {
    document.getElementById('qtabs').innerHTML = Q.map((q, i) => `<button class="qtab ${i === current ? 'act' : ''}" data-q="${i}">${q.title}</button>`).join('');
    const q = Q[current];
    document.getElementById('qtext').innerHTML = `${q.title}. ${q.text}`;
    const panel = (o, rec) => `<div class="opt ${rec ? 'rec' : ''}"><div class="opt-h"><div><b>${o.name}</b><div class="why">${o.why}</div></div>${rec ? '<span class="rec-pill">My suggestion</span>' : ''}</div><div class="screen">${o.screen()}</div></div>`;
    document.getElementById('main').innerHTML = panel(q.a, true) + panel(q.b, false);
  }
  document.addEventListener('click', (e) => { const t = e.target.closest('[data-q]'); if (t) { current = Number(t.dataset.q); draw(); } });
  draw();
</script>
</body>
</html>
