<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

  .sb-item.sub { padding-left: 34px; font-size: 11.5px; }

  .sb-uav { width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; }
  .sb-uname { font-size: 11px; font-weight: 700; color: rgba(255,255,255,.8); } .sb-urole { font-size: 9px; color: rgba(255,255,255,.3); }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; }

  .pc-actions { position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; background: #fff; padding: 6px; border-radius: 12px; box-shadow: 0 8px 22px rgba(26,29,46,.18); }

  /* Create / edit page */
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; align-items: start; }
  .sec { padding: 18px 20px; border-top: 1px solid #ECEEF8; } .sec:first-child { border-top: none; }

  .row3 { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
  label.f { font-size: 11px; font-weight: 700; color: #5A6080; display: block; } label.f .inp { margin-top: 5px; }
  .lst { width: 100%; border-collapse: collapse; font-size: 12px; } .lst td { padding: 6px 0; border-top: 1px solid #F2F3FA; } .lst tr:first-child td { border-top: none; }
  .lst label { display: flex; gap: 8px; align-items: center; cursor: pointer; } .lst input[type=checkbox] { accent-color: #4040C8; }

  .dept { border: 1.5px solid #E2E4F0; border-radius: 12px; padding: 10px 12px; font-size: 11.5px; background: #FAFBFF; }
  .dept-n { font-weight: 800; font-size: 12px; margin-bottom: 6px; color: #3535B5; }
  .dept div { display: flex; justify-content: space-between; padding: 2px 0; } .dept span:last-child { font-family: 'DM Mono', monospace; font-weight: 700; }
  .total { margin-top: 12px; font-size: 12px; color: #5A6080; background: #F2F3FA; border-radius: 10px; padding: 9px 12px; }
  .ent-box { background: #EEEEFF; color: #3535B5; border-radius: 12px; padding: 16px 18px; font-size: 12.5px; line-height: 1.6; }
  .ent-box b { font-size: 14px; display: block; margin-bottom: 2px; }
  .foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid #ECEEF8; }
  .preview-t { font-size: 11px; font-weight: 700; color: #5A6080; margin-bottom: 26px; }
  .sticky { position: sticky; top: 0; }

  /* Create page v2: everything on one screen — a top bar card + side-by-side cards */
  .content.fit { overflow: hidden; padding: 16px 22px; }
  .ed { display: flex; flex-direction: column; gap: 14px; height: 100%; }
  .ed-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr auto; gap: 12px; align-items: end; padding: 14px 18px; }
  .ed-top .btns { display: flex; gap: 8px; }
  .ed-cards { display: grid; grid-template-columns: 1.15fr 1fr 290px; gap: 14px; flex: 1; min-height: 0; }
  .ed-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .ec { padding: 14px 16px; display: flex; flex-direction: column; min-height: 0; }

  .ec-t { font-size: 13px; font-weight: 800; } .ec-s { font-size: 10.5px; color: #9BA3C4; font-weight: 500; }
  .mods { display: flex; flex-direction: column; gap: 6px; }
  .mt { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border: 1.5px solid #ECEEF8; border-radius: 12px; background: #fff; cursor: pointer; transition: .15s; min-height: 44px; }
  .mt:hover { border-color: #C9CBF5; }
  .mt.on { border-color: #4040C8; background: linear-gradient(90deg, #F5F5FF, #fff); box-shadow: 0 3px 10px rgba(64,64,200,.08); }
  .mt-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 800; flex: none; background: #F2F3FA; color: #9BA3C4; transition: .15s; }
  .mt.on .mt-ic { background: #4040C8; color: #fff; }
  .mt-tx { flex: 1; min-width: 0; }
  .mt-nm { font-size: 12px; font-weight: 700; color: #1A1D2E; }
  .mt:not(.on) .mt-nm { color: #5A6080; font-weight: 600; }
  .mt-cap { font-size: 10px; color: #9BA3C4; margin-top: 1px; }
  .step { display: flex; align-items: center; border: 1.5px solid #DCDDF5; border-radius: 9px; overflow: hidden; background: #fff; }
  .step button { width: 24px; height: 26px; border: none; background: #F5F5FF; color: #4040C8; font-weight: 800; font-size: 13px; cursor: pointer; font-family: inherit; }
  .step button:hover { background: #EEEEFF; } .step button:disabled { color: #C9CBF5; cursor: default; background: #FAFAFF; }
  .step input { width: 38px; height: 26px; border: none; text-align: center; font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 700; color: #1A1D2E; outline: none; }
  .step-l { font-size: 10px; color: #9BA3C4; font-weight: 600; margin-left: 6px; }
  .incl { font-size: 10px; font-weight: 700; color: #16A34A; background: rgba(34,197,94,.12); border-radius: 20px; padding: 3px 9px; }
  .sw { width: 32px; height: 18px; border-radius: 20px; background: #DDE0EE; position: relative; flex: none; transition: .15s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: .15s; }
  .mt.on .sw { background: #4040C8; } .mt.on .sw::after { left: 16px; }
  .ec-count { margin-left: auto; font-size: 10.5px; font-weight: 700; color: #4040C8; background: #EEEEFF; border-radius: 20px; padding: 3px 9px; }
  .mod { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 9px; border: 1.5px solid #ECEEF8; border-radius: 9px; font-size: 11.5px; min-height: 34px; }
  .mod.on { border-color: #C9CBF5; background: #FAFAFF; }
  .mod label { display: flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; } .mod input[type=checkbox] { accent-color: #4040C8; }
  .mod .num { width: 64px; padding: 4px 8px; font-size: 11px; }
  .prow2 { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 12px; border-top: 1px solid #F2F3FA; } .prow2:first-of-type { border-top: none; }
  .prow2 .num { width: 70px; padding: 5px 9px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin-top: 10px; overflow-y: auto; min-height: 0; flex: 1; align-content: start; padding: 2px; }
  .dc { border: 1.5px solid #DCDDF5; border-radius: 12px; padding: 8px 10px; background: linear-gradient(180deg, #F7F7FF, #fff); }
  .dc-n { font-size: 11px; font-weight: 800; color: #3535B5; margin-bottom: 6px; }
  .dc-r { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #5A6080; padding: 2px 0; }
  .dc-r b { font-family: 'DM Mono', monospace; color: #1A1D2E; }
  .dc .step button { width: 22px; height: 22px; font-size: 12px; } .dc .step input { width: 28px; height: 22px; font-size: 11px; }
  .chip { border: 1.5px solid #E2E4F0; border-radius: 9px; padding: 5px 8px; font-size: 10.5px; background: #FAFBFF; line-height: 1.35; }
  .chip b { color: #3535B5; display: block; font-size: 11px; }
  .chip.more { display: grid; place-items: center; color: #5A6080; font-weight: 700; }
  .tot { margin-top: auto; font-size: 11.5px; color: #5A6080; background: #F2F3FA; border-radius: 10px; padding: 8px 11px; }
  .ed-prev { display: flex; flex-direction: column; align-items: center; padding-top: 22px; min-height: 0; }

  .ent-wide { grid-column: 1 / 3; }

  .cfields .wide { grid-column: 1 / 3; }
  .chint { font-size: 11.5px; color: #3535B5; background: #EEEEFF; border-radius: 10px; padding: 9px 12px; margin-top: 12px; line-height: 1.55; }
  .pc-contact { width: 100%; font-size: 11.5px; font-weight: 600; color: #3A3F55; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .pc-contact div { display: flex; gap: 8px; align-items: center; } .pc-contact span:first-child { width: 16px; text-align: center; }

  .ov { position: fixed; inset: 0; background: rgba(26,29,46,.5); display: none; justify-content: center; align-items: flex-start; padding: 6vh 16px; z-index: 30; }

<body>
<div class="demo" id="demo">
  <button data-v="spark" class="on">spark_admin · Subscriptions</button>
  <button data-v="edit">spark_admin · Create page</button>
  <button data-v="client">Client · Subscription</button>
</div>

<div class="app-shell">
  <aside class="sb" id="sb"></aside>
  <div class="main"><div class="topbar" id="topbar"></div><div class="content" id="page"></div></div>
</div>
<div class="ov" id="ov"><div class="card modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1900); }
const LOGO = `<svg width="14" height="14" viewBox="0 0 14 14"><rect x=".5" y=".5" width="5.5" height="5.5" rx="1" fill="white"/><rect x="8" y=".5" width="5.5" height="5.5" rx="1" fill="white" opacity=".4"/><rect x=".5" y="8" width="5.5" height="5.5" rx="1" fill="white" opacity=".4"/><rect x="8" y="8" width="5.5" height="5.5" rx="1" fill="white"/></svg>`;

const MODULES = [
  ["quarterly", "Quarterly Report", true], ["earnings", "Earnings Report", true], ["annual", "Annual Report", true],
  ["board", "Board Report", true], ["esg", "ESG Validator", true], ["compliance", "Compliance Validation", false],
  ["meetings", "Board Meetings", false], ["leadership", "Leadership", false], ["arv", "Annual Report Validator", true],
];
const DURATIONS = { quarterly: ["Quarterly", "per quarter"], half: ["Half year", "per 6 months"], year: ["1 year", "per year"], enterprise: ["Enterprise", ""] };
// Tab colours, in the Centriyon palette (blue, teal, deep indigo, ink for Enterprise).
const COLOURS = ["#4F7BE8", "#14B8A6", "#3535B5", "#7C3AED"];

let PLANS = [
  { id: 1, name: "Basic", duration: "quarterly", price: 4500, modules: { quarterly: 2, annual: 1 }, pm: 1, ir: 1, depts: 2, deptUsers: [2, 1], users: 1 },
  { id: 2, name: "Standard", duration: "half", price: 12000, modules: { quarterly: 4, earnings: 2, annual: 1, compliance: null }, pm: 2, ir: 1, depts: 3, deptUsers: [4, 2, 2], users: 2 },
  { id: 3, name: "Premium", duration: "year", price: 40000, modules: { quarterly: 12, earnings: 8, annual: 3, board: 10, esg: 6, compliance: null, meetings: null, leadership: null }, pm: 5, ir: 2, depts: 6, deptUsers: [6, 5, 4, 3, 3, 2], users: 0 },
  { id: 4, name: "Enterprise", duration: "enterprise", price: null, modules: {}, pm: 0, ir: 0, depts: 0, deptUsers: [], users: 0,
    contact: { message: "Every module, as many reports and people as you need — sized for your company.", email: "sales@centriyon.com", phone: "+966 11 000 0000", person: "Centriyon Sales" } },
];
const MY_PLAN = 2;   // Aramco is on Standard
let view = "spark", selected = null, editing = null, filter = "all";

const money = (n) => n == null ? "" : n.toLocaleString("en-US");
const deptUsersTotal = (p) => (p.deptUsers || []).reduce((sum, n) => sum + n, 0);
const people = (p) => 1 + p.pm + p.ir + p.depts + deptUsersTotal(p);

function frame() {
  const spark = view !== "client";
  $("sb").innerHTML = `<div class="sb-header"><div class="sb-logo"><div class="sb-lmark">${LOGO}</div><div class="sb-lname">Centriyon</div></div></div>
    ${spark ? `<div class="sb-sec">Spark</div><button class="sb-item">Overview</button><button class="sb-item sub">Companies</button>
      <button class="sb-item sub act" onclick="go('spark')">Subscriptions</button><button class="sb-item sub">Quotes</button><button class="sb-item sub">Licenses (on-premises)</button>`
    : `<div class="sb-sec">IR System</div><button class="sb-item">Command Center</button><button class="sb-item">Reports</button>
      <div class="sb-sec">Admin</div><button class="sb-item">Admin Console</button><button class="sb-item sub act">Subscription</button><button class="sb-item sub">Users &amp; Roles</button><button class="sb-item sub">Departments</button>`}
    <div class="sb-user"><div class="sb-uav">${spark ? "UJ" : "AA"}</div><div><div class="sb-uname">${spark ? "Usama Javed" : "Aizaz Admin Aramco"}</div><div class="sb-urole">${spark ? "Spark Admin" : "Admin"}</div></div></div>`;
  $("topbar").innerHTML = view === "edit"
    ? `<span class="tb-page tb-link" onclick="go('spark')">Subscriptions</span><span class="tb-sep">›</span><span class="tb-sub">${editing.id ? "Edit " + (editing.name || "plan") : "Create subscription"}</span>`
    : `<span class="tb-page">${spark ? "Subscriptions" : "Subscription"}</span>${spark ? "" : '<span class="tb-sep">·</span><span class="tb-sub">Aramco</span>'}`;
}

// ── One pricing card (same on both sides) ──
function card(p, i, opts) {
  const ent = p.duration === "enterprise";
  const colour = ent ? "#1A1D2E" : COLOURS[i % 3];
  const lines = [];
  if (!ent) {
    for (const [k, label, counted] of MODULES) {
      const on = k in p.modules;
      const lim = p.modules[k];
      lines.push(`<li class="${on ? "" : "off"}"><span class="ic ${on ? "ok" : "no"}">${on ? "✓" : "✗"}</span><span>${label}${on && counted ? ` · ${lim} report${lim === 1 ? "" : "s"}` : ""}</span></li>`);
    }
    lines.push(`<li><span class="ic ok">✓</span><span>1 admin (included)</span></li>`);
    lines.push(`<li><span class="ic ok">✓</span><span>${p.pm} project manager${p.pm === 1 ? "" : "s"} · ${p.ir} IR user${p.ir === 1 ? "" : "s"}</span></li>`);
    lines.push(`<li><span class="ic ok">✓</span><span>${p.depts} department${p.depts === 1 ? "" : "s"} · 1 HOD each · ${deptUsersTotal(p)} department user${deptUsersTotal(p) === 1 ? "" : "s"}</span></li>`);
  }
  const flag = opts.current ? '<span class="badge b-gn">Your plan</span>' : opts.madeForYou ? '<span class="badge b-am">Made for you</span>'
    : opts.spark && p.users ? `<span class="badge b-gy">${p.users} compan${p.users === 1 ? "y" : "ies"}</span>` : "";
  const body = ent
    ? contactBody(p.contact || {})
    : `<div class="pc-price"><span class="pc-cur">$</span><b>${money(p.price)}</b><small>${DURATIONS[p.duration][1].replace(" ", "<br>")}</small></div>
       <div class="pc-line"></div><ul>${lines.join("")}</ul>`;
  const button = opts.spark || opts.preview ? ""
    : opts.current ? `<button class="pc-buy" disabled>Current · ends 3 May 2027</button>`
    : ent ? `<button class="pc-buy" onclick="event.stopPropagation();quoteForm()">Contact us</button>`
    : `<button class="pc-buy" onclick="event.stopPropagation();toast('→ Payment page for ${p.name} (${DURATIONS[p.duration][0]})')">Buy now</button>`;
  const actions = opts.spark && selected === p.id
    ? `<div class="pc-actions"><button class="btn bp bsm" onclick="event.stopPropagation();openEditor(${p.id})">✎ Edit</button>
       <button class="btn bs bsm" onclick="event.stopPropagation();toast('${p.users ? "Archived — nobody new can buy it" : "Plan deleted"}')">${p.users ? "Archive" : "Delete"}</button></div>` : "";
  return `<div class="pc ${opts.spark ? "clickable" : ""} ${opts.spark && selected === p.id ? "sel" : ""} ${opts.current ? "current" : ""}"
      ${opts.spark ? `onclick="pick(${p.id})"` : ""}>
    <div class="pc-tab" style="background:${colour}">${p.name || "Plan name"}</div>
    <span class="pc-flag">${flag}</span>
    ${body}
    ${button ? '<div class="pc-line"></div>' : '<div style="height:8px"></div>'}
    ${button}${actions}
  </div>`;
}

function contactBody(c) {
  const rows = [["👤", c.person], ["✉", c.email], ["☎", c.phone]].filter((r) => r[1]);
  return `<div class="pc-ent"><b>Let's talk</b>${c.message || "Tell us what you need."}</div>
    ${rows.length ? `<div class="pc-line"></div><div class="pc-contact">${rows.map((r) => `<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>` : ""}`;
}
function durationChips() {
  const chips = [["all", "All"], ["quarterly", "Quarterly"], ["half", "Half year"], ["year", "1 year"]];
  return `<div class="tabs">${chips.map(([k, l]) => `<button class="tab ${filter === k ? "act" : ""}" onclick="filter='${k}';render()">${l}</button>`).join("")}</div>`;
}
const shown = () => PLANS.filter((p) => filter === "all" || p.duration === filter || p.duration === "enterprise");

// ── spark_admin: the cards ──
function sparkView() {
  return `<div class="phead"><div><div class="ptitle">Subscription plans</div><div class="psub">What every cloud company sees on its Subscription page. Click a plan to edit it.</div></div>
    <div style="display:flex;gap:10px;align-items:center">${durationChips()}<button class="btn bp" onclick="openEditor()">+ Create subscription</button></div></div>
  <div class="stage"><div class="stage-title">Published plans</div><div class="cards">${shown().map((p, i) => card(p, PLANS.indexOf(p), { spark: true })).join("")}</div></div>
  <div class="note">Try: click <b>Standard</b> → <b>✎ Edit</b> opens the same page as Create, filled in. Drafts and Archived stay as tabs above the cards (not shown here to keep it short).</div>`;
}
function pick(id) { selected = selected === id ? null : id; render(); }

// ── spark_admin: create / edit page ──
function openEditor(id) {
  const base = id ? PLANS.find((p) => p.id === id) : { name: "", duration: "year", price: null, modules: {}, pm: 1, ir: 1, depts: 1, deptUsers: [1], users: 0 };
  editing = JSON.parse(JSON.stringify(base));
  go("edit");
}
function editView() {
  const f = editing, ent = f.duration === "enterprise";
  const idx = f.id ? PLANS.findIndex((p) => p.id === f.id) : PLANS.length;
  const ICON = { quarterly: "Q", earnings: "E", annual: "A", board: "B", esg: "ESG", compliance: "✓", meetings: "M", leadership: "L", arv: "AV" };
  const picked = MODULES.filter(([k]) => k in f.modules).length;
  const modules = MODULES.map(([k, label, counted]) => {
    const on = k in f.modules;
    const n = f.modules[k];
    // Report modules: a − n + stepper, never below 1. Access-only modules: "Included".
    const right = !on ? '<span class="mt-cap">Off</span>'
      : counted ? `<div class="step" onclick="event.stopPropagation()"><button data-dec="${k}" ${n <= 1 ? "disabled" : ""}>−</button><input data-l="${k}" inputmode="numeric" value="${n}"><button data-inc="${k}">+</button></div><span class="step-l">reports</span>`
      : '<span class="incl">Included</span>';
    return `<div class="mt ${on ? "on" : ""}" data-m="${k}" data-counted="${counted ? 1 : 0}">
      <div class="mt-ic">${ICON[k]}</div>
      <div class="mt-tx"><div class="mt-nm">${label}</div><div class="mt-cap">${counted ? "Reports per plan period" : "Access only — no report count"}</div></div>
      ${right}<div class="sw"></div></div>`;
  }).join("");
  // One card per department: 1 HOD, and its users with − / + (never below 1).
  const chips = f.deptUsers.map((n, i) => `<div class="dc"><div class="dc-n">Department ${i + 1}</div>
      <div class="dc-r"><span>HOD</span><b>1</b></div>
      <div class="dc-r"><span>Users</span><div class="step"><button data-ddec="${i}" ${n <= 1 ? "disabled" : ""}>−</button><input data-du="${i}" inputmode="numeric" value="${n}"><button data-dinc="${i}">+</button></div></div>
    </div>`).join("");
  const buttons = `<div class="btns"><button class="btn bs" onclick="go('spark')">Cancel</button>${f.id ? "" : '<button class="btn bs" onclick="save(\'draft\')">Save draft</button>'}<button class="btn bp" onclick="save('pub')">${f.id ? "Save" : "Publish"}</button></div>`;
  const preview = `<div class="card ed-prev"><div class="preview-t" style="margin-bottom:22px">Preview</div>${card(f, idx, { preview: true })}</div>`;
  return `<div class="ed">
    <div class="card ed-top">
      <label class="f">Plan name<input class="inp" id="nm" value="${f.name}" placeholder="e.g. Standard"></label>
      <label class="f">Duration<select class="inp" id="du">${Object.entries(DURATIONS).map(([k, [l]]) => `<option value="${k}" ${f.duration === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      ${ent ? "<div></div>" : `<label class="f">Price (USD) <span class="muted">${DURATIONS[f.duration][1]}</span><input class="inp mono" id="pr" value="${f.price ?? ""}" placeholder="—"></label>`}
      ${buttons}
    </div>
    <div class="ed-cards">
      ${ent ? `<div class="card ec ent-wide">
        <div class="ec-h"><div class="ec-ic">✉</div><div><div class="ec-t">Contact details</div><div class="ec-s">What companies see on the Enterprise card — no modules, users or departments to set</div></div></div>
        <div class="cfields">
          <label class="f wide">Message on the card<textarea class="inp" rows="2" data-c="message" placeholder="e.g. Every module, sized for your company.">${f.contact?.message ?? ""}</textarea></label>
          <label class="f">Contact person / team<input class="inp" data-c="person" value="${f.contact?.person ?? ""}" placeholder="e.g. Centriyon Sales"></label>
          <label class="f">Email<input class="inp" type="email" data-c="email" value="${f.contact?.email ?? ""}" placeholder="sales@centriyon.com"></label>
          <label class="f">Phone<input class="inp" data-c="phone" value="${f.contact?.phone ?? ""}" placeholder="+966 ..."></label>
        </div>
        <div class="chint">The card's <b>Contact us</b> button opens <b>Get a quote</b>: the client says what they need, you're notified, and you make a plan just for them on the Quotes page.</div>
      </div>` : `
      <div class="card ec">
        <div class="ec-h"><div class="ec-ic">▦</div><div><div class="ec-t">Modules</div><div class="ec-s">Switch a module on · reports start at 1 (never 0 or unlimited)</div></div><span class="ec-count">${picked} of ${MODULES.length} on</span></div>
        <div class="mods">${modules}</div>
      </div>
      <div class="ed-col">
        <div class="card ec">
          <div class="ec-h"><div class="ec-ic">👤</div><div><div class="ec-t">Users</div><div class="ec-s">The admin is always included</div></div></div>
          <div class="prow2"><span>Admin</span><span class="lock">🔒 1 · included</span></div>
          <div class="prow2"><span>Project managers (PMs)</span><input class="inp num" data-p="pm" value="${f.pm}"></div>
          <div class="prow2"><span>IR users</span><input class="inp num" data-p="ir" value="${f.ir}"></div>
        </div>
        <div class="card ec" style="flex:1;min-height:0">
          <div class="ec-h"><div class="ec-ic">▤</div><div><div class="ec-t">Departments</div><div class="ec-s">Each has 1 HOD and at least 1 user</div></div></div>
          <div class="prow2"><span>Number of departments</span><input class="inp num" data-depts value="${f.depts}"></div>
          <div class="chips">${chips || '<span class="muted" style="font-size:11px">No departments.</span>'}</div>
          <div class="tot" style="margin-top:10px">Total <b>${people(f)} people</b></div>
        </div>
      </div>`}
      ${preview}
    </div>
  </div>`;
}
function editViewOld() {
  const f = editing, ent = f.duration === "enterprise";
  const idx = 0, modules = "", depts = "";
  return `<div class="grid">
    <div class="card">
      <div class="sec">
        <div class="sec-t">Plan</div>
        <div class="row3">
          <label class="f">Plan name<input class="inp" id="nm" value="${f.name}" placeholder="e.g. Standard"></label>
          <label class="f">Duration<select class="inp" id="du">${Object.entries(DURATIONS).map(([k, [l]]) => `<option value="${k}" ${f.duration === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
          ${ent ? '<div></div>' : `<label class="f">Price (USD) <span class="muted">${DURATIONS[f.duration][1]}</span><input class="inp mono" id="pr" value="${f.price ?? ""}" placeholder="—"></label>`}
        </div>
      </div>
      ${ent ? `<div class="sec"><div class="ent-box"><b>Contact us</b>Enterprise has no fixed modules, users or departments. Companies see a <b>Contact us</b> button; it opens <b>Get a quote</b>, and you make a plan just for them from the Quotes page.</div></div>` : `
      <div class="sec"><div class="sec-t">Modules and reports <i>(blank = unlimited)</i></div>${modules}</div>
      <div class="sec"><div class="sec-t">People</div>
        <table class="lst">
          <tr><td>Admin</td><td class="r"><span class="lock">🔒 1 · included</span></td></tr>
          <tr><td>Project managers (PMs)</td><td class="r"><input class="inp num" data-p="pm" value="${f.pm}"></td></tr>
          <tr><td>IR users</td><td class="r"><input class="inp num" data-p="ir" value="${f.ir}"></td></tr>
        </table>
      </div>
      <div class="sec"><div class="sec-t">Departments <i>(each has 1 HOD and at least 1 user)</i></div>
        <table class="lst">
          <tr><td>Number of departments</td><td class="r"><input class="inp num" data-p="depts" value="${f.depts}"></td></tr>
          <tr><td>Users in each department <span class="muted">(min 1)</span></td><td class="r"><input class="inp num" data-p="perDept" data-min="1" value="${f.perDept}"></td></tr>
        </table>
        <div class="depts">${depts || '<span class="muted" style="font-size:12px">No departments.</span>'}</div>
        <div class="total">Total <b>1 admin + ${f.pm} PM + ${f.ir} IR + ${f.depts} × (1 HOD + ${f.perDept}) = ${people(f)} people</b></div>
      </div>`}
      <div class="foot"><button class="btn bs" onclick="go('spark')">Cancel</button>${f.id ? "" : '<button class="btn bs" onclick="save(\'draft\')">Save draft</button>'}
        <button class="btn bp" onclick="save('pub')">${f.id ? "Save" : "Publish"}</button></div>
    </div>
    <div class="sticky"><div class="preview-t">Preview — how companies will see it</div><div class="cards">${card(f, idx, { preview: true })}</div></div>
  </div>`;
}
function wireEditor() {
  const f = editing;
  if (!f) return;
  const nm = $("nm"); if (nm) nm.oninput = (e) => { f.name = e.target.value; document.querySelector(".ed-prev .pc-tab").textContent = f.name || "Plan name"; };
  const du = $("du"); if (du) du.onchange = (e) => { f.duration = e.target.value; render(); };
  const pr = $("pr"); if (pr) pr.onchange = (e) => { f.price = e.target.value ? +e.target.value : null; render(); };
  document.querySelectorAll(".mt[data-m]").forEach((t) => t.onclick = () => {
    const k = t.dataset.m;
    if (k in f.modules) delete f.modules[k]; else f.modules[k] = t.dataset.counted === "1" ? 1 : null;
    render();
  });
  document.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => { f.modules[b.dataset.inc] += 1; render(); });
  document.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => { f.modules[b.dataset.dec] = Math.max(1, f.modules[b.dataset.dec] - 1); render(); });
  document.querySelectorAll("[data-l]").forEach((i) => i.onchange = () => {
    const n = Math.floor(+i.value);
    if (!(n >= 1)) toast("Reports must be at least 1");
    f.modules[i.dataset.l] = n >= 1 ? n : 1;
    render();
  });
  document.querySelectorAll("[data-p]").forEach((i) => i.onchange = () => { const min = +(i.dataset.min || 0); f[i.dataset.p] = Math.max(min, +i.value || 0); render(); });
  const dn = document.querySelector("[data-depts]");
  if (dn) dn.oninput = () => {
    const n = Math.max(0, Math.min(50, Math.floor(+dn.value) || 0));
    const users = f.deptUsers.slice(0, n);
    while (users.length < n) users.push(1);
    f.depts = n; f.deptUsers = users;
    render();
    const again = document.querySelector("[data-depts]"); again.focus(); again.setSelectionRange(again.value.length, again.value.length);
  };
  document.querySelectorAll("[data-dinc]").forEach((b) => b.onclick = () => { f.deptUsers[+b.dataset.dinc] += 1; render(); });
  document.querySelectorAll("[data-ddec]").forEach((b) => b.onclick = () => { const i = +b.dataset.ddec; f.deptUsers[i] = Math.max(1, f.deptUsers[i] - 1); render(); });
  document.querySelectorAll("[data-du]").forEach((inp) => inp.onchange = () => {
    const n = Math.floor(+inp.value);
    if (!(n >= 1)) toast("A department needs at least 1 user");
    f.deptUsers[+inp.dataset.du] = n >= 1 ? n : 1;
    render();
  });
  document.querySelectorAll("[data-c]").forEach((i) => i.onchange = () => { f.contact = { ...(f.contact || {}), [i.dataset.c]: i.value.trim() }; render(); });
}
function save(kind) {
  const f = editing;
  if (!f.name.trim()) return toast("Give the plan a name");
  if (f.duration !== "enterprise" && f.price == null) return toast("Set a price first");
  if (f.id) { if (PLANS.find((p) => p.id === f.id).users) return usedWarning(f); Object.assign(PLANS.find((p) => p.id === f.id), f); }
  else PLANS.splice(PLANS.length - 1, 0, { ...f, id: Date.now() });
  selected = null; go("spark"); toast(kind === "draft" ? "Saved as draft" : f.id ? "Plan saved" : "Plan published");
}
function usedWarning(f) {
  $("modal").innerHTML = `<button class="x" onclick="closeModal()">✕</button>
    <div style="font-size:15px;font-weight:800">2 companies are on ${f.name}</div><div class="muted" style="font-size:12px;margin-top:3px">Aramco, BUPA</div>
    <label style="display:flex;gap:9px;font-size:12px;margin-top:12px;padding:10px 12px;border:1.5px solid #E2E4F0;border-radius:10px;cursor:pointer"><input type="radio" name="w"><span><b>Apply to everyone on ${f.name}</b><br><span class="muted">They get the new modules and limits now.</span></span></label>
    <label style="display:flex;gap:9px;font-size:12px;margin-top:8px;padding:10px 12px;border:1.5px solid #4040C8;border-radius:10px;cursor:pointer"><input type="radio" name="w" checked><span><b>Only for new subscriptions</b><br><span class="muted">They keep the old ${f.name} until they subscribe again.</span></span></label>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn bs" onclick="closeModal()">Back</button>
    <button class="btn bp" onclick="Object.assign(PLANS.find(p=>p.id===${f.id}), editing);closeModal();selected=null;go('spark');toast('Plan saved')">Save</button></div>`;
  $("ov").classList.add("open");
}

// ── Client ──
function clientView() {
  const custom = { id: 9, name: "Aramco plus", duration: "year", price: 52000, modules: { quarterly: 12, annual: 3, board: 10, compliance: null }, pm: 6, ir: 2, depts: 6, deptUsers: [5, 5, 4, 3, 2, 2], madeForYou: true };
  const list = [custom, ...shown()];
  return `<div class="phead"><div><div class="ptitle">Subscription</div><div class="psub">You're on <b style="color:#1A1D2E">Standard</b> (half year) until 3 May 2027.</div></div>${durationChips()}</div>
    <div class="stage"><div class="stage-title">Choose the plan that fits Aramco</div><div class="cards">
      ${list.map((p) => card(p, p.madeForYou ? 0 : PLANS.indexOf(p), { current: p.id === MY_PLAN, madeForYou: p.madeForYou })).join("")}
    </div></div>
    <div class="note"><b>Buy now</b> → the payment page (test mode). <b>Contact us</b> on Enterprise → the Get a quote form. Get a quote is also still reachable from Enterprise only.</div>`;
}
function quoteForm() {
  $("modal").innerHTML = `<button class="x" onclick="closeModal()">✕</button>
    <div style="font-size:15px;font-weight:800">Contact us — Enterprise</div><div class="muted" style="font-size:12px;margin-top:3px">Tell us what you need; Centriyon prepares a plan just for Aramco and sends you a price.</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:600;margin-top:12px;color:#3535B5">${(() => { const c = PLANS.find((p) => p.duration === "enterprise").contact || {}; return [["👤", c.person], ["✉", c.email], ["☎", c.phone]].filter((r) => r[1]).map((r) => `<span>${r[0]} ${r[1]}</span>`).join(""); })()}</div>
    <div class="muted" style="font-size:11.5px;margin-top:12px;background:#F2F3FA;border-radius:10px;padding:10px 12px">(The same Get a quote form as now: modules + reports, admin included, PMs, IR users, departments with 1 HOD + users each, and a note.)</div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn bs" onclick="closeModal()">Cancel</button><button class="btn bp" onclick="closeModal();toast('Request sent — Centriyon will send you a price')">Send request</button></div>`;
  $("ov").classList.add("open");
}
function closeModal() { $("ov").classList.remove("open"); }

function go(v) { view = v; document.querySelectorAll("#demo button").forEach((b) => b.classList.toggle("on", b.dataset.v === v)); if (v === "edit" && !editing) openEditor(); else render(); }
function render() {
  frame();
  $("page").classList.toggle("fit", view === "edit");
  $("page").innerHTML = { spark: sparkView, edit: editView, client: clientView }[view]();
  if (view === "edit") wireEditor();
}
document.querySelectorAll("#demo button").forEach((b) => b.onclick = () => { if (b.dataset.v === "edit") openEditor(); else go(b.dataset.v); });
render();
</script>
